aid: univers
name: Univers
description: >-
  Univers (formerly Envision Digital) is a Singapore-headquartered company
  building "The Platform for Physical AI" — its EnOS platform runs real-time,
  autonomous operations across energy grids, buildings, transportation, and
  industrial manufacturing, managing over 1,000 GW of energy assets and 400M+
  connected sensors and devices for 800+ enterprise customers in 45 countries.
  EnOS exposes open APIs for device connection, models, assets, time-series
  data, alerts, and data subscription, consumed through the EnOS Application
  Portal and Developer Console with access-key/secret-key request signing, and
  ships first-party device and service SDKs for Java, Python, C, Node.js, .NET,
  and Go.
