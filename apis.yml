apis:
- name: EnOS Open API
  description: >-
    The EnOS platform open APIs cover the core platform services — model,
    device connection, asset, asset tree, alert engine, TSDB time-series data,
    and data subscription. Applications register in the EnOS Application
    Portal / Developer Console for an accessKey and secretKey, and every
    request is signed (the first-party service SDKs generate signatures and
    assemble gateway URLs automatically). The API gateway address is
    per-environment; the EU2 instance gateway is used as the reference base
    URL here. Documentation is hosted on support.enos-iot.com, which may be
    geo-restricted.
  humanURL: https://support.enos-iot.com/docs/api/en/3.0.0/overview.html
  baseURL: https://ag-eu2.envisioniot.com
